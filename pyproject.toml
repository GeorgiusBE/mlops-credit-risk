[project]
name = "my-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "Georgius",email = "georgiusbenedikt09@gmail.com"}
]
requires-python = ">=3.10,<4"
dependencies = [
    "pandas>=2.3,<3; python_version < '3.11'",
    "pandas>=3.1,<4; python_version >= '3.11'",
    "numpy>=2.2,<2.3; python_version < '3.11'",
    "numpy>=2.4,<2.5; python_version == '3.11'",
    "numpy>=2.5,<3; python_version >= '3.12'",
    "scikit-learn>=1.7,<1.8; python_version < '3.11'",
    "scikit-learn>=1.9,<2; python_version >= '3.11'",
    "pyarrow>=25,<26; python_version < '3.11'",
    "pyarrow>=26,<27; python_version >= '3.11'",
    "duckdb>=1.5,<2; python_version < '3.11'",
    "duckdb>=2,<3; python_version >= '3.11'",
    "matplotlib>=3.10,<3.11; python_version < '3.11'",
    "matplotlib>=3.11,<4; python_version >= '3.11'",
    "lightgbm>=4.7,<5",
    "mlflow>=3.18,<4",
    # MLflow's UI imports GraphQL 3 APIs; its own bounds also allow GraphQL 2.
    "graphene>=3.4.3,<4",
    "graphql-core>=3.2.14,<3.3",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
